name: Go CI

on:
  push:
    branches:
      - master
    paths:
      - '**/*.go'
      - 'cmd/cli/testdata/**'
      - 'internal/web/ui/**'
      - 'docs/**'
      - '.mprlab/deploy/resources.yml'
      - 'configs/license-rollout.yaml'
      - 'configs/licensing/**'
      - 'scripts/licensing/**'
      - '.github/workflows/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '**/*.go'
      - 'cmd/cli/testdata/**'
      - 'internal/web/ui/**'
      - 'docs/**'
      - '.mprlab/deploy/resources.yml'
      - 'configs/license-rollout.yaml'
      - 'configs/licensing/**'
      - 'scripts/licensing/**'
      - '.github/workflows/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Verify Chrome installation
        run: |
          "${{ steps.setup-chrome.outputs.chrome-path }}" --version

      - name: Download dependencies
        run: go mod download

      - name: Set up Gateway contract tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gateway_directory="$RUNNER_TEMP/gix-gateway-v9"
          mkdir -p "$gateway_directory"
          gh release download v9.0.0 --repo MarcoPoloResearchLab/mprlab-gateway \
            --pattern mprlab-gateway-v9.0.0-linux-amd64.tar.gz --dir "$gateway_directory"
          cd "$gateway_directory"
          echo '1c9a6def1fe0200cd051239bb3f04ec5bce95abd19b64ff178ac932e520695d1  mprlab-gateway-v9.0.0-linux-amd64.tar.gz' | sha256sum --check
          tar -xzf mprlab-gateway-v9.0.0-linux-amd64.tar.gz
          echo "$gateway_directory/bin" >> "$GITHUB_PATH"

      - name: Install git-filter-repo
        run: |
          python3 -m pip install --user git-filter-repo
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Verify formatting
        run: make check-format

      - name: Run linting
        run: make lint

      - name: Run unit tests
        env:
          GIX_TEST_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: make test-unit

      - name: Run integration tests
        run: make test-integration
