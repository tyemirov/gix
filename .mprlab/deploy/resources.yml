mprlab_resources:
  owner: gix
  release:
    scheme: semver
    fixed_major: 1
  defaults:
    timeouts:
      startup: 1m
      completion: 30m
      readiness: 10m
      request: 1m
      shutdown: 30s
  operations:
    app_lifecycle.repository_read:
      polling:
        initial: 1s
        maximum: 10s
        increment: 1s
        multiplier: 2
        attempt_limit: 5
  ci:
    enabled: true
    command:
      "0": make
      "1": ci
  resources:
    command-line:
      kind: github_release_binary
      repository: tyemirov/gix
      build:
        system: go
        package: .
        binary: gix
        version_symbol: github.com/tyemirov/gix/internal/version.linkedVersion
        platforms:
          - linux/amd64
          - linux/arm64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
    website:
      kind: github_pages
      repository: tyemirov/gix
      branch: gh-pages
      domain: gix.mprlab.com
      url: https://gix.mprlab.com/
      source:
        kind: directory
        path: docs
      verification:
        path: /.mprlab-release.json
